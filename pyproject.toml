[project]
name = "powerbi-doc"
dynamic = ["version"]
description = "Générateur automatique de documentation Power BI (.pbip)"
requires-python = ">=3.14"
dependencies = [
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Outils de développement : `pip install -e ".[dev]"`
dev = [
    "taskipy>=1.14.1",
    "ruff>=0.16.0",
    "pyinstaller>=6.10",
]
# Captures d'écran des visuels : `pip install -e ".[capture]"`. En option — le
# document reste complet sans elles, avec ses emplacements réservés.
capture = [
    "pywinauto>=0.6.9 ; sys_platform == 'win32'",
    "mss>=9.0",
]

[project.scripts]
powerbi-doc = "src.cli:main"

# Commandes rapides
[tool.taskipy.tasks]
install = "pip install -e \".[dev]\""
run = "python main.py"
# Captures des visuels. `task capture -- rapport.pbip --plan` pour voir ce qui
# serait pris, `--fake` pour éprouver la chaîne sans Power BI.
capture = "python -m src.capture"
test = "python -m unittest discover -s tests -t ."
lint = "ruff check ."
format-check = "ruff format --check ."
format = "ruff format ."
check = "task format && task lint && task test"

# Distribution : `task package` produit dist/powerbi-doc-<version>-windows.zip
# à remettre aux utilisateurs.
build = "pyinstaller --noconfirm --clean powerbi-doc.spec"
package = "task format-check && task lint && task test && task build && python tools/package.py"

clean = "python -c \"import shutil; from pathlib import Path; [shutil.rmtree(p, ignore_errors=True) for p in Path('.').rglob('__pycache__')]; [p.unlink(missing_ok=True) for p in Path('.').rglob('*.pyc')]; [shutil.rmtree(d, ignore_errors=True) for d in ['.pytest_cache', '.ruff_cache', 'build', 'dist']]; print('OK - Nettoyage terminé')\""
help = "task --list"

[tool.setuptools]
packages = ["src"]

# La version est déclarée dans `src/__init__.py`, seul endroit où elle vit.
[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Au-delà des règles par défaut (E4/E7/E9, F) : celles qui attrapent de vraies
# bévues (B, BLE, S, RET), celles qui allègent le code (SIM, C4, PIE, PERF,
# FURB, UP) et celles qui tiennent les frontières du projet (T20 — aucun
# `print` hors de `src.console`, TID, ARG).
select = [
    "A",      # ombrage des noms de la bibliothèque standard
    "ARG",    # arguments jamais utilisés
    "B",      # pièges courants (flake8-bugbear)
    "BLE",    # `except Exception` aveugle
    "C4",     # compréhensions inutilement détournées
    "C90",    # complexité cyclomatique
    "DTZ",    # dates sans fuseau horaire
    "E",      # style (pycodestyle)
    "EXE",    # bit exécutable et shebang
    "F",      # erreurs certaines (pyflakes)
    "FURB",   # tournures modernisables
    "I",      # ordre des imports
    "ICN",    # alias d'import conventionnels
    "INT",    # gettext
    "ISC",    # concaténation de chaînes implicite
    "LOG",    # journalisation
    "N",      # conventions de nommage
    "PERF",   # boucles remplaçables
    "PIE",    # code superflu
    "PL",     # pylint (complexité, constantes magiques…)
    "Q",      # guillemets
    "RET",    # retours de fonction
    "RSE",    # `raise` superflu
    "RUF",    # règles propres à Ruff
    "S",      # sécurité (bandit)
    "SIM",    # simplifications
    "SLOT",   # `__slots__`
    "T20",    # `print` et `pprint`
    "TID",    # imports relatifs
    "TRY",    # gestion des exceptions
    "UP",     # syntaxe rattrapable (pyupgrade)
    "W",      # espaces et fins de ligne
    "YTT",    # tests de version de Python
]
# Le document et la console emploient des caractères typographiques que Ruff
# signale comme homoglyphes : ils sont voulus.
allowed-confusables = ["›", "‹", "×"]
ignore = [
    # Les messages d'erreur sont rédigés en français, à l'endroit où ils sont
    # levés, et cités tels quels à l'utilisateur : les sortir dans une variable
    # ou dans la classe d'exception les éloignerait de leur contexte.
    "TRY003",
    # Conflit connu avec `ruff format`.
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
# Les tests décrivent des cas : `assert`, nombres en clair, signatures longues
# et imports tardifs y sont normaux.
"tests/*" = ["ARG005", "PLC0415", "PLR0913", "PLR0917", "PLR2004", "S101"]
# Outil de construction : sa sortie console *est* son interface.
"tools/*" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 5
