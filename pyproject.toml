[project]
name = "powerbi-doc"
dynamic = ["version"]
description = "Générateur automatique de documentation Power BI (.pbip)"
requires-python = ">=3.14"
dependencies = [
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Outils de développement : `pip install -e ".[dev]"`
dev = [
    "taskipy>=1.14.1",
    "ruff>=0.16.0",
    "pyinstaller>=6.10",
]

[project.scripts]
powerbi-doc = "src.cli:main"

# Commandes rapides
[tool.taskipy.tasks]
install = "pip install -e \".[dev]\""
run = "python main.py"
test = "python -m unittest discover -s tests -t ."
lint = "ruff check ."
format-check = "ruff format --check ."
format = "ruff format ."
check = "task format && task lint && task test"

# Distribution : `task package` produit dist/powerbi-doc-<version>-windows.zip
# à remettre aux utilisateurs.
build = "pyinstaller --noconfirm --clean powerbi-doc.spec"
package = "task format-check && task lint && task test && task build && python tools/package.py"

clean = "python -c \"import shutil; from pathlib import Path; [shutil.rmtree(p, ignore_errors=True) for p in Path('.').rglob('__pycache__')]; [p.unlink(missing_ok=True) for p in Path('.').rglob('*.pyc')]; [shutil.rmtree(d, ignore_errors=True) for d in ['.pytest_cache', '.ruff_cache', 'build', 'dist']]; print('OK - Nettoyage terminé')\""
help = "task --list"

[tool.setuptools]
packages = ["src"]

# La version est déclarée dans `src/__init__.py`, seul endroit où elle vit.
[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.ruff]
line-length = 100
target-version = "py314"
